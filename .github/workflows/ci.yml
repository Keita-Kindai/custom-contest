name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ここのnameが`main`のrulesetで要求するstatus checkの名前になる。変えるとゲートが外れる。
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 公開範囲と認可の判定はDBのqueryそのものにある。DBの無いCIではその確認がskipされ、
    # 「通った」という結果が実際には何も確かめていない状態になる。
    #
    # 版は本番（Neon）に合わせる。ここが本番より古いと、CIが通る範囲のほうが
    # 狭くなり、差のぶんは誰も試していないことになる。
    # 確認: `pg_dump`の出力ヘッダに`Dumped from database version`が入っている。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custom_contest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 統合testは実在するカタログの問題を参照する。migrationだけでは外部キーを満たせない。
      - name: Prepare the test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/custom_contest_ci
        run: |
          pnpm db:migrate
          pnpm --filter @custom-contest/web db:seed-problems

      # DATABASE_URLはこの段だけに渡す。buildへ渡すと、本来DBを見ないはずの
      # 生成処理がDBに繋がっても気づけなくなる。
      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/custom_contest_ci
        run: pnpm test

      - name: Build
        run: pnpm build

      # 既知の脆弱性はリリースの判断材料なので、結果を毎回残す。
      # highとcriticalだけを落とす。lowで無関係のPRまで止めない。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
